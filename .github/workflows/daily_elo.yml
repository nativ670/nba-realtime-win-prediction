name: Daily Elo Update

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6:00 AM UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  update-elo:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy nba_api requests

    - name: Run Elo Updater
      run: python src/data_ingestion/update_elo.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/processed/live_elo.csv
        git commit -m "data: auto-update live elo ratings [skip ci]" || echo "No changes to commit"
        git push origin main
