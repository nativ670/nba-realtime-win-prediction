version: '3.8'

services:
  api:
    build: .
    container_name: nba-wp-api
    command: uvicorn src.models.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./mlruns:/app/mlruns
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: .
    container_name: nba-wp-frontend
    command: streamlit run src/frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1

  pipeline:
    build: .
    container_name: nba-wp-pipeline
    # The pipeline service is designed to run the daily update manually via docker-compose
    command: python src/data_ingestion/daily_update.py
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    profiles:
      - batch
    environment:
      - PYTHONUNBUFFERED=1
